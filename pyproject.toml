[project]
name = "reporter"
version = "0.1.0"
description = "Generate monthly activity PDFs from git commits using Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "google-genai>=1.0.0",
    "GitPython>=3.1.40",
    "fpdf2>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
reporter = "tra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tra"]
